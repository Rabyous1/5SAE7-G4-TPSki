# Server configuration
server.port=8083
spring.mvc.format.date=yyyy-MM-dd

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=0000


### JPA / HIBERNATE ###
# Affiche les requêtes SQL générées par Hibernate
spring.jpa.show-sql=true
# Mettez à jour le schéma de la base de données automatiquement
spring.jpa.hibernate.ddl-auto=update
# Spécifie le dialecte MySQL pour Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect

### Logging configuration ###
logging.level.root=info
# Logging pattern for the console
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{45} - %msg%n

### Actuator and Prometheus configuration ###
management.endpoints.web.base-path=/actuator
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.exposure.include=*
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
