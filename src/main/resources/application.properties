# -------------------------------------
# Server Configuration
# -------------------------------------
server.port=8083
server.address=192.168.50.4
spring.mvc.format.date=yyyy-MM-dd

# -------------------------------------
# Database Configuration
# -------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=0000
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect

# -------------------------------------
# Actuator and Prometheus Configuration
# -------------------------------------
# Expose Actuator endpoints
management.endpoints.web.exposure.include=prometheus,health,info
# Enable Prometheus metrics
management.endpoint.prometheus.enabled=true
# Allow Prometheus access without authentication
management.endpoint.prometheus.required-role=NONE

# -------------------------------------
# Logging Configuration
# -------------------------------------
logging.level.root=info
# Logging pattern for the console
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level- %logger{45} - %msg %n

# -------------------------------------
# Spring Boot Admin / Monitoring
# -------------------------------------

management.endpoint.metrics.enabled=true

