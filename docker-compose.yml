version: '3.8'

services:
  app:
    image: haifa903/devops-app-gestion
    build:
      context: .
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD:
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db
    # Optional: Use a wait-for-it script to ensure DB is ready before app starts

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: db
      MYSQL_ROOT_PASSWORD:
    ports:
      - "3309:3306" # Expose MySQL on port 3309 externally but internally it will still use 3306
    volumes:
      - db_data:/var/lib/mysql # Persist MySQL data

volumes:
  db_data: # Named volume to persist data across container restarts
    driver: local
