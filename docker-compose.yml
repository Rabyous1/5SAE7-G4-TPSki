version: '3.8'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: gestion_station_ski
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  app-gestion:
    depends_on:
      - mysql
    build:
      context: .
      dockerfile: Dockerfile
    image: app-gestion:latest
    ports:
      - "8083:8080"
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.datasource.url" : "jdbc:mysql://mysql:3306/gestion_station_ski?createDatabaseIfNotExist=true",
        "spring.datasource.username" : "appuser",
        "spring.datasource.password" : "password123",
        "spring.jpa.properties.hibernate.dialect" : "org.hibernate.dialect.MySQL5InnoDBDialect",
        "spring.jpa.hibernate.ddl-auto" : "update",
        "server.servlet.context-path": "/api",
        "server.port": "8080",
        "management.endpoints.web.exposure.include": "*",
        "management.endpoint.prometheus.enabled": "true",
        "management.metrics.export.prometheus.enabled": "true",
        "management.endpoints.web.base-path": "/actuator",
        "management.metrics.export.prometheus.rsocket.enabled": "false"
      }'
    restart: on-failure
    stdin_open: true
    tty: true
    networks:
      - app-network

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always
    networks:
      - app-network

  prometheus:
    image: prom/prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always
    networks:
      - app-network

networks:
  app-network:

volumes:
  db_data:
  grafana_data:
