version: '3.8'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: gestion_station_ski
    ports:
      - "3307:3306"  # Remplacez 3306 par 3307 ici
    volumes:
      - db_data:/var/lib/mysql

  app-gestion:
    depends_on:
      - mysql
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:8080"  # Utilise le port 8083 en local au lieu de 8080
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.datasource.url" : "jdbc:mysql://mysql:3306/gestion_station_ski?createDatabaseIfNotExist=true",
        "spring.datasource.username" : "appuser",
        "spring.datasource.password" : "password123",
        "spring.jpa.properties.hibernate.dialect" : "org.hibernate.dialect.MySQL5InnoDBDialect",
        "spring.jpa.hibernate.ddl-auto" : "update",
        "server.servlet.context-path": "/api",
        "server.port": "8089"
      }'
    restart: on-failure
    stdin_open: true
    tty: true